<!DOCTYPE html>
<html lang="nl">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Squadpage Team123</title>
    <link rel="stylesheet" href="styles/styleJoost.css">
  </head>
  <body>

    <section id="home">
      <h1>Home</h1>
    </section>

    <section id="squad">
      <h1>The Squad</h1>
      <p>Meet the creative minds behind the code and design</p>

      <div class="kaartBrowser">
        <button>
          <svg viewbox="0 0 64 64">
            <use href="assets/joost/Pijl.svg#icoon" />
          </svg>
        </button>

        <search>
          <form>
            <input name="zoektekst" type="text">
            <button type="submit">
              <svg viewbox="0 0 64 64">
                <use href="assets/joost/Loep.svg#icoon" />
              </svg>
            </button>
          </form>
        </search>

        <button>
          <svg viewbox="0 0 64 64">
            <use href="assets/joost/Pijl.svg#icoon" />
          </svg>
        </button>

        <!--Hierin komen de visitekaartjes.-->
        <div class="visitekaartjes"></div>
      </div>

    </section>

    <section id="explore">
        <h1>Campus</h1>
    </section>

    <section id="contact">
      <h1>Contact</h1>
    </section>

    <nav>
        <a href="#home">
          <svg viewbox="0 0 64 64">
            <use href="assets/joost/Huis.svg#icoon" />
          </svg>
          <span>Home</span></a>
        <a href="#squad">
          <svg viewbox="0 0 64 64">
            <use href="assets/joost/Visitekaart.svg#icoon" />
          </svg>
          <span>Squad</span></a>
        <a href="#explore">
          <svg viewbox="0 0 64 64">
            <use href="assets/joost/Campus.svg#icoon" />
          </svg>
          <span>Explore</span></a>
        <a href="#contact">
          <svg viewbox="0 0 64 64">
            <use href="assets/joost/Tekstballon.svg#icoon" />
          </svg>
          <span>Contact</span></a>
    </nav>

    <script type="module" src="scripts/scriptJoost.js"></script>

  </body>
</html>
